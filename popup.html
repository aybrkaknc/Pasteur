<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Pasteur</h1>
    <span id="status" aria-live="polite"></span>
    <input type="checkbox" id="enabled" class="switch" data-i18n-label="optEnabled">
  </header>

  <section id="unlockCard" class="card warn" hidden>
    <div class="row">
      <div class="label" data-i18n="unlockBlocked"></div>
      <button id="unlockNow" class="btn" data-i18n="unlockNow"></button>
    </div>
  </section>

  <section class="card site">
    <div>
      <div class="label" data-i18n="popupDisableSite"></div>
      <div id="siteHost" class="sub"></div>
    </div>
    <input type="checkbox" id="disableSite" class="switch" data-i18n-label="popupDisableSite">
  </section>

  <section class="card">
    <div class="row">
      <div>
        <div class="label" data-i18n="optAutoCopy"></div>
        <div class="sub" data-i18n="optAutoCopyHint"></div>
      </div>
      <input type="checkbox" id="autoCopy" class="switch" data-i18n-label="optAutoCopy">
    </div>
    <div class="row">
      <div class="label" data-i18n="optCopyInFields"></div>
      <input type="checkbox" id="copyInFields" class="switch" data-i18n-label="optCopyInFields">
    </div>
    <div class="row">
      <div>
        <div class="label" data-i18n="optUnlockPage"></div>
        <div class="sub" data-i18n="optUnlockPageHint"></div>
      </div>
      <input type="checkbox" id="unlockPage" class="switch" data-i18n-label="optUnlockPage">
    </div>
  </section>

  <section class="card">
    <div class="grid">
      <label>
        <span class="sub" data-i18n="optDuration"></span>
        <input type="number" id="duration" min="500" max="10000" step="100">
      </label>
      <label>
        <span class="sub" data-i18n="optMinLength"></span>
        <input type="number" id="minLength" min="1" max="50">
      </label>
    </div>
    <label class="full">
      <span class="sub" data-i18n="optSearchEngine"></span>
      <select id="searchEngine">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
        <option value="yandex">Yandex</option>
      </select>
    </label>
    <label class="full">
      <span class="sub" data-i18n="optPosition"></span>
      <select id="position">
        <option value="above" data-i18n="posAbove"></option>
        <option value="below" data-i18n="posBelow"></option>
        <option value="cursor" data-i18n="posCursor"></option>
        <option value="top-left" data-i18n="posTopLeft"></option>
        <option value="top-right" data-i18n="posTopRight"></option>
        <option value="bottom-left" data-i18n="posBottomLeft"></option>
        <option value="bottom-right" data-i18n="posBottomRight"></option>
        <option value="custom" data-i18n="posCustom"></option>
      </select>
    </label>
    <div id="customOffset" hidden>
      <div class="grid full">
        <label>
          <span class="sub" data-i18n="optOffsetX"></span>
          <input type="number" id="offsetX" min="-1000" max="1000" step="5">
        </label>
        <label>
          <span class="sub" data-i18n="optOffsetY"></span>
          <input type="number" id="offsetY" min="-1000" max="1000" step="5">
        </label>
      </div>
      <div class="sub" data-i18n="optOffsetHint"></div>
    </div>
  </section>

  <section class="card">
    <label>
      <span class="sub" data-i18n="highlightColorLabel"></span>
      <select id="highlightColor">
        <option value="yellow" data-i18n="colorYellow"></option>
        <option value="green" data-i18n="colorGreen"></option>
        <option value="pink" data-i18n="colorPink"></option>
        <option value="blue" data-i18n="colorBlue"></option>
      </select>
    </label>
    <div class="row full">
      <div>
        <div class="label" data-i18n="optHighlightsTitle"></div>
        <div id="hlCount" class="sub"></div>
      </div>
      <button id="hlClear" class="btn" data-i18n="optHighlightsClear" disabled></button>
    </div>
    <div class="row">
      <span id="hlPos" class="sub"></span>
      <div class="nav-group">
        <button id="hlPrev" class="btn icon" data-i18n-label="hlPrevious" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button id="hlNext" class="btn icon" data-i18n-label="hlNext" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <details class="card">
    <summary data-i18n="optExcludedTitle"></summary>
    <textarea id="excludedSites" rows="4" placeholder="example.com"></textarea>
    <div class="sub" data-i18n="optExcludedHint"></div>
  </details>

  <script src="shared/settings.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="popup/bridge.js"></script>
  <script src="popup/form.js"></script>
  <script src="popup/highlights.js"></script>
  <script src="popup/site.js"></script>
  <script src="popup/unlock.js"></script>
  <script src="popup/main.js"></script>
</body>
</html>
