<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <label class="row"><input type="checkbox" id="enabled"> <span data-i18n="optEnabled"></span></label>
  <label class="row"><input type="checkbox" id="autoCopy"> <span data-i18n="optAutoCopy"></span></label>
  <p class="hint" data-i18n="optAutoCopyHint"></p>
  <label class="row"><input type="checkbox" id="copyInFields"> <span data-i18n="optCopyInFields"></span></label>

  <label class="field"><span data-i18n="optDuration"></span>
    <input type="number" id="duration" min="500" max="10000" step="100">
  </label>
  <label class="field"><span data-i18n="optMinLength"></span>
    <input type="number" id="minLength" min="1" max="50">
  </label>
  <label class="field"><span data-i18n="optSearchEngine"></span>
    <select id="searchEngine">
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="bing">Bing</option>
      <option value="yandex">Yandex</option>
    </select>
  </label>
  <label class="field"><span data-i18n="optExcluded"></span>
    <textarea id="excludedSites" rows="6" placeholder="example.com"></textarea>
  </label>

  <p id="status" aria-live="polite"></p>

  <script src="settings.js"></script>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
